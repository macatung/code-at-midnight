<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070e" />
      <stop offset="50%" stop-color="#071022" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="ogText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00b4d8" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1.2" fill="#00f5d4" fill-opacity="0.25" />
    </pattern>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogGrid)" />

  <!-- Outer Cyber Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Corner Reticle Brackets -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#00f5d4" stroke-width="3" />
  <path d="M 1160 80 L 1160 40 L 1120 40" fill="none" stroke="#00f5d4" stroke-width="3" />
  <path d="M 40 550 L 40 590 L 80 590" fill="none" stroke="#00f5d4" stroke-width="3" />
  <path d="M 1160 550 L 1160 590 L 1120 590" fill="none" stroke="#00f5d4" stroke-width="3" />

  <!-- Top Metadata Bar -->
  <g transform="translate(64, 68)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f5d4" font-weight="600">
    <rect x="0" y="-14" width="190" height="24" rx="4" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-width="1" />
    <text x="95" y="2" text-anchor="middle">YOUTUBE: @MaGiaiMa</text>
    <text x="210" y="2" fill="#38bdf8">PORTAL: decode.macatung.dev</text>
    <text x="1070" y="2" text-anchor="end" fill="#ffb703">[SYS.DECONSTRUCT: PILOT]</text>
  </g>

  <!-- Main Left Content -->
  <g transform="translate(64, 180)">
    <!-- Channel Title -->
    <text x="0" y="0" font-family="'Be Vietnam Pro', 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#ogText)" letter-spacing="2">
      MA GIẢI MÃ
    </text>

    <!-- Tagline Highlight -->
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" fill="#ffffff">
      Mở nắp những hệ thống vô hình vận hành thế giới.
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Vén màn bí mật của 5 siêu hệ thống: Visa 100k, Google Search, Cáp quang biển,
    </text>
    <text x="0" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Cây rút tiền ATM &amp; Vệ tinh định vị Grab qua Thuyết tương đối.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 190)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#0c172e" stroke="#00f5d4" stroke-width="1.5" />
      <text x="85" y="22" fill="#00f5d4" text-anchor="middle">ISOMETRIC 3D</text>

      <rect x="186" y="0" width="180" height="34" rx="8" fill="#0c172e" stroke="#38bdf8" stroke-width="1.5" />
      <text x="276" y="22" fill="#38bdf8" text-anchor="middle">BYTEBYTEGO STYLE</text>

      <rect x="382" y="0" width="180" height="34" rx="8" fill="#0c172e" stroke="#ffb703" stroke-width="1.5" />
      <text x="472" y="22" fill="#ffd166" text-anchor="middle">CAD BLUEPRINT</text>
    </g>
  </g>

  <!-- Right Visual Emblem (Isometric M Core) -->
  <g transform="translate(940, 315)" filter="url(#ogGlow)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.5" />

    <!-- Isometric M Core -->
    <g transform="translate(0, -10)">
      <!-- Left Column -->
      <polygon points="-70,-20 -35,-45 -35,35 -70,60" fill="#0369a1" />
      <polygon points="-35,-45 0,-20 0,60 -35,35" fill="#0284c7" />
      <polygon points="-70,-20 -35,-45 0,-20 -35,5" fill="#38bdf8" />

      <!-- Right Column -->
      <polygon points="0,-20 35,-45 35,35 0,60" fill="#0369a1" />
      <polygon points="35,-45 70,-20 70,60 35,35" fill="#0284c7" />
      <polygon points="0,-20 35,-45 70,-20 35,5" fill="#38bdf8" />

      <!-- Apex Core Diamond -->
      <polygon points="-18,-35 0,-50 18,-35 0,-20" fill="#00f5d4" />
      <circle cx="0" cy="-65" r="9" fill="#ffd166" />
      <circle cx="0" cy="-65" r="4" fill="#ffffff" />
      <line x1="0" y1="-65" x2="0" y2="-50" stroke="#ffd166" stroke-width="2" />
    </g>

    <!-- Subtitle Pill -->
    <rect x="-80" y="90" width="160" height="28" rx="6" fill="#060c18" stroke="#00f5d4" stroke-width="1.2" />
    <text x="0" y="109" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f5d4" text-anchor="middle">
      PILOT SEASON
    </text>
  </g>
</svg>
