    <polygon points="0,-2 8,-8 16,-2 8,4" fill="url(#favIsoTop)" />

    <!-- Apex Core -->
    <polygon points="-4,-6 0,-10 4,-6 0,-2" fill="#00f5d4" />
    <circle cx="0" cy="-14" r="2.5" fill="#ffd166" />
