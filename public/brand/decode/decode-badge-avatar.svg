<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Deep Space Blueprint Radial Gradient -->
    <radialGradient id="avBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0f1d38" />
      <stop offset="45%" stop-color="#081022" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="avBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>

    <!-- Gold Semiconductor Core Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Lifted Heat Spreader (Lid) Cyan Gradients -->
    <linearGradient id="lidTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="lidLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="lidRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Base Substrate PCB Plate Gradients -->
    <linearGradient id="subTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="subLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="subRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="avShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. SQUIRCLE BASE CONTAINER -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#avBg)" stroke="url(#avBorder)" stroke-width="3.5" filter="url(#avShadow)" />

  <!-- 2. ARCHITECTURAL BLUEPRINT GRID & CAD GUIDE LINES -->
  <g opacity="0.16">
    <!-- Concentric Drafting Calipers -->
    <circle cx="256" cy="226" r="190" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="256" cy="226" r="156" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="256" cy="226" r="110" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 4" />
    <circle cx="256" cy="226" r="60" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 3" />

    <!-- 30° Isometric Coordinate Axis Guides -->
    <line x1="80" y1="124" x2="432" y2="328" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="432" y1="124" x2="80" y2="328" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 6" />

    <!-- Cardinal Crosshair Ticks -->
    <line x1="256" y1="42" x2="256" y2="70" stroke="#38bdf8" stroke-width="2" />
    <line x1="256" y1="382" x2="256" y2="410" stroke="#38bdf8" stroke-width="2" />
    <line x1="70" y1="226" x2="98" y2="226" stroke="#38bdf8" stroke-width="2" />
    <line x1="414" y1="226" x2="442" y2="226" stroke="#38bdf8" stroke-width="2" />

    <!-- 30-Degree Ticks on R=156 Circle -->
    <g transform="translate(256, 226)">
      <line x1="0" y1="-156" x2="0" y2="-146" stroke="#38bdf8" stroke-width="2" />
      <line x1="78" y1="-135" x2="73" y2="-126" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="135" y1="-78" x2="126" y2="-73" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="156" y1="0" x2="146" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="135" y1="78" x2="126" y2="73" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="78" y1="135" x2="73" y2="126" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="0" y1="156" x2="0" y2="146" stroke="#38bdf8" stroke-width="2" />
      <line x1="-78" y1="135" x2="-73" y2="126" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-135" y1="78" x2="-126" y2="73" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-156" y1="0" x2="-146" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="-135" y1="-78" x2="-126" y2="-73" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-78" y1="-135" x2="-73" y2="-126" stroke="#38bdf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- 3. TOP HUD CHANNEL PILL BADGE -->
  <g transform="translate(256, 56)">
    <rect x="-74" y="-13" width="148" height="26" rx="7" fill="#08142b" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" />
    <circle cx="-56" cy="0" r="3.5" fill="#ffd166" />
    <text x="5" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">
      @MaGiaiMa
    </text>
  </g>

  <!-- 4. EXPLODED ISOMETRIC SYSTEM CORE ("MỞ NẮP KIẾN TRÚC") -->
  <!-- ======================================================= -->
  <g id="exploded-isometric-core" transform="translate(256, 226)">

    <!-- A. Exploded-View Dynamic Laser Alignment Rays -->
    <!-- Vertical dashed beam linking Substrate -> Silicon M -> Lifted Lid -->
    <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6">
      <line x1="-54" y1="-80" x2="-54" y2="85" />
      <line x1="54" y1="-80" x2="54" y2="85" />
      <line x1="0" y1="-62" x2="0" y2="105" />
      <line x1="-80" y1="-95" x2="-80" y2="70" />
      <line x1="80" y1="-95" x2="80" y2="70" />
    </g>

    <!-- Side CAD Callout Annotation: "MỞ NẮP" -->
    <g transform="translate(108, -88)">
      <path d="M 0 0 L 16 0 L 24 -12 L 48 -12" stroke="#ffd166" stroke-width="1.2" fill="none" opacity="0.85" />
      <circle cx="0" cy="0" r="2.5" fill="#ffd166" />
      <text x="24" y="-17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#ffd166" letter-spacing="0.5">
        ▲ +85mm [MỞ NẮP]
      </text>
    </g>

    <!-- ======================================================== -->
    <!-- LAYER 1 (BOTTOM): ISOMETRIC SUBSTRATE & PINS (Y_BASE = 72) -->
    <!-- ======================================================== -->
    <g id="layer-substrate" transform="translate(0, 72)">
      <!-- Golden Microchip Bus Pins Radiating Outwards -->
      <g stroke="#ffd166" stroke-width="2.5" stroke-linecap="round">
        <!-- Left-Bottom Edge Pins -->
        <line x1="-80" y1="-4" x2="-100" y2="-15" />
        <line x1="-64" y1="5" x2="-84" y2="-6" />
        <line x1="-48" y1="14" x2="-68" y2="3" />
        <line x1="-32" y1="23" x2="-52" y2="12" />
        
        <!-- Right-Bottom Edge Pins -->
        <line x1="80" y1="-4" x2="100" y2="-15" />
        <line x1="64" y1="5" x2="84" y2="-6" />
        <line x1="48" y1="14" x2="68" y2="3" />
        <line x1="32" y1="23" x2="52" y2="12" />

        <!-- Front Apex Pins -->
        <line x1="-16" y1="32" x2="-24" y2="46" />
        <line x1="0" y1="41" x2="0" y2="56" />
        <line x1="16" y1="32" x2="24" y2="46" />
      </g>

      <!-- Substrate Base Slab Drop Facets (Thickness 14px) -->
      <!-- Left Vertical Edge -->
      <polygon points="-90,0 -54,21 -54,35 -90,14" fill="url(#subLeft)" stroke="#0284c7" stroke-width="1.2" />
      <!-- Left-Center Vertical Edge -->
      <polygon points="-54,21 0,42 0,56 -54,35" fill="url(#subLeft)" stroke="#0284c7" stroke-width="1.2" />
      <!-- Right-Center Vertical Edge -->
      <polygon points="0,42 54,21 54,35 0,56" fill="url(#subRight)" stroke="#0369a1" stroke-width="1.2" />
      <!-- Right Vertical Edge -->
      <polygon points="54,21 90,0 90,14 54,35" fill="url(#subRight)" stroke="#0369a1" stroke-width="1.2" />

      <!-- Substrate Top Hexagonal Plate -->
      <polygon points="-90,0 -54,-21 0,-42 54,-21 90,0 54,21 0,42 -54,21" fill="url(#subTop)" stroke="#38bdf8" stroke-width="2" />

      <!-- High-Density Circuit Traces on Substrate Surface -->
      <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M -68 -5 L -42 -5 L -30 2 L -14 2" />
        <circle cx="-68" cy="-5" r="2.5" fill="#ffd166" />
        <circle cx="-14" cy="2" r="2" fill="#38bdf8" />

        <path d="M 68 -5 L 42 -5 L 30 2 L 14 2" />
        <circle cx="68" cy="-5" r="2.5" fill="#ffd166" />
        <circle cx="14" cy="2" r="2" fill="#38bdf8" />

        <path d="M -40 16 L -24 16 L 0 28 L 24 16 L 40 16" />
        <circle cx="-40" cy="16" r="2" fill="#ffd166" />
        <circle cx="40" cy="16" r="2" fill="#ffd166" />
        <circle cx="0" cy="28" r="2.5" fill="#38bdf8" />
      </g>
    </g>


    <!-- ======================================================== -->
    <!-- LAYER 2 (MIDDLE): THE SILICON "M" MONOGRAM CORE (Y = 0)  -->
    <!-- ======================================================== -->
    <g id="layer-silicon-m-core" transform="translate(0, -6)">

      <!-- Golden Silicon Glow Flare Behind the Core -->
      <polygon points="-75,10 0,-34 75,10 0,54" fill="#ffd166" opacity="0.15" />

      <!-- LEFT "M" TOWER -->
      <g id="m-left-tower">
        <!-- Vertical Left Drop Facet -->
        <polygon points="-72,-16 -46,-2 -46,36 -72,22" fill="url(#goldLeft)" stroke="#b45309" stroke-width="1.2" />
        <!-- Vertical Right Drop Facet -->
        <polygon points="-46,-2 -18,-18 -18,20 -46,36" fill="url(#goldRight)" stroke="#78350f" stroke-width="1.2" />
        <!-- Top Illuminated Rhombus Face -->
        <polygon points="-72,-16 -44,-32 -16,-17 -46,-2" fill="url(#goldTop)" stroke="#ffffff" stroke-width="1.5" />

        <!-- Etched Microcircuit Logic Lines on Top Facet -->
        <line x1="-58" y1="-24" x2="-44" y2="-16" stroke="#b45309" stroke-width="1.2" />
        <line x1="-44" y1="-28" x2="-32" y2="-21" stroke="#b45309" stroke-width="1.2" />
        <circle cx="-44" cy="-16" r="2" fill="#ffffff" />
      </g>

      <!-- RIGHT "M" TOWER -->
      <g id="m-right-tower">
        <!-- Vertical Left Drop Facet -->
        <polygon points="18,-18 46,-2 46,36 18,20" fill="url(#goldLeft)" stroke="#b45309" stroke-width="1.2" />
        <!-- Vertical Right Drop Facet -->
        <polygon points="46,-2 72,-16 72,22 46,36" fill="url(#goldRight)" stroke="#78350f" stroke-width="1.2" />
        <!-- Top Illuminated Rhombus Face -->
        <polygon points="46,-2 16,-17 44,-32 72,-16" fill="url(#goldTop)" stroke="#ffffff" stroke-width="1.5" />

        <!-- Etched Microcircuit Logic Lines on Top Facet -->
        <line x1="58" y1="-24" x2="44" y2="-16" stroke="#b45309" stroke-width="1.2" />
        <line x1="44" y1="-28" x2="32" y2="-21" stroke="#b45309" stroke-width="1.2" />
        <circle cx="44" cy="-16" r="2" fill="#ffffff" />
      </g>

      <!-- CENTRAL "M" SADDLE / APEX BRIDGE (CONNECTING THE TWO TOWERS) -->
      <g id="m-center-bridge">
        <!-- Center Recessed Vertical Drop Facet -->
        <polygon points="-18,-18 0,-8 0,14 -18,4" fill="url(#goldRight)" stroke="#78350f" stroke-width="1" />
        <polygon points="0,-8 18,-18 18,4 0,14" fill="url(#goldLeft)" stroke="#b45309" stroke-width="1" />

        <!-- Center V-Saddle Top Chevron -->
        <polygon points="-16,-17 0,-8 16,-17 0,-26" fill="url(#goldTop)" stroke="#ffffff" stroke-width="1.2" />

        <!-- Pulsing Center Logic Nexus Node (The Heart of the Decoding Engine) -->
        <polygon points="-8,-9 0,-14 8,-9 0,-4" fill="#ffffff" stroke="#ffd166" stroke-width="1.2" />
        <circle cx="0" cy="-9" r="2.5" fill="#0284c7" />

        <!-- Gold Wirebonds connecting Nexus to Towers -->
        <line x1="-8" y1="-9" x2="-24" y2="-4" stroke="#ffffff" stroke-width="1.2" />
        <line x1="8" y1="-9" x2="24" y2="-4" stroke="#ffffff" stroke-width="1.2" />
      </g>
    </g>


    <!-- ======================================================== -->
    <!-- LAYER 3 (TOP): THE LIFTED HEAT-SPREADER LID ("MỞ NẮP")   -->
    <!-- (Y = -92, HOVERING SUSPENDED IN MID-AIR)                 -->
    <!-- ======================================================== -->
    <g id="layer-lifted-lid" transform="translate(0, -92)">

      <!-- Lid Drop Shadow cast on layers below -->
      <polygon points="-64,28 0,-7 64,28 0,63" fill="#030712" opacity="0.35" />

      <!-- Vertical Extrusion Facets of the Lid (Thickness 12px) -->
      <!-- Left Edge -->
      <polygon points="-68,0 -38,17 -38,29 -68,12" fill="url(#lidLeft)" stroke="#0284c7" stroke-width="1.2" />
      <!-- Left Front Edge -->
      <polygon points="-38,17 0,38 0,50 -38,29" fill="url(#lidLeft)" stroke="#0284c7" stroke-width="1.2" />
      <!-- Right Front Edge -->
      <polygon points="0,38 38,17 38,29 0,50" fill="url(#lidRight)" stroke="#0369a1" stroke-width="1.2" />
      <!-- Right Edge -->
      <polygon points="38,17 68,0 68,12 38,29" fill="url(#lidRight)" stroke="#0369a1" stroke-width="1.2" />

      <!-- Top Plate Surface of the Lifted Lid -->
      <polygon points="-68,0 -38,-17 0,-38 38,-17 68,0 38,17 0,38 -38,17" fill="url(#lidTop)" stroke="#ffffff" stroke-width="2" />

      <!-- Inner Recessed Bevel on Lid -->
      <polygon points="-54,0 -30,-13 0,-30 30,-13 54,0 30,13 0,30 -30,13" fill="#081429" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Laser-Engraved "M" Deconstruction Monogram on Top Lid -->
      <g transform="translate(0, 0)">
        <!-- Engraved Center Golden Aperture -->
        <polygon points="-14,0 0,-8 14,0 0,8" fill="url(#goldTop)" stroke="#ffffff" stroke-width="1" />
        <circle cx="0" cy="0" r="2" fill="#060d1a" />

        <!-- Bold Engraved "M" Vector Monogram -->
        <path d="M -22 6 L -22 -6 L -10 2 L 0 -4 L 10 2 L 22 -6 L 22 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- Text: DECODE -->
        <text x="0" y="19" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
          DECODE
        </text>
      </g>
    </g>

  </g>

  <!-- ======================================================= -->
  <!-- 5. BOTTOM TYPOGRAPHY & OFFICIAL CHANNEL IDENTITY        -->
  <!-- ======================================================= -->
  <g transform="translate(256, 420)">
    <!-- Primary Channel Name (100% Sans-Serif Vector Perfect Harmony) -->
    <text x="0" y="0" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      MA GIAI MÃ
    </text>
    <path d="M 11.5 -26 C 11.5 -30, 16.5 -30, 16.5 -27 C 16.5 -25, 14 -24, 14 -22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Subtitle: Subdomain & Spec -->
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      decode.macatung.dev
    </text>

    <!-- Tagline (100% Vietnamese Font Compatibility) -->
    <text x="0" y="44" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      Mở nắp những hệ thống vô hình vận hành thế giới
    </text>
  </g>

  <!-- 6. CORNER ARCHITECTURAL DRAFTING CALIPER BRACKETS -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Top-Left Bracket -->
    <path d="M 44 76 L 44 44 L 76 44" />
    <circle cx="44" cy="44" r="2.5" fill="#38bdf8" />

    <!-- Top-Right Bracket -->
    <path d="M 468 76 L 468 44 L 436 44" />
    <circle cx="468" cy="44" r="2.5" fill="#38bdf8" />

    <!-- Bottom-Left Bracket -->
    <path d="M 44 436 L 44 468 L 76 468" />
    <circle cx="44" cy="468" r="2.5" fill="#38bdf8" />

    <!-- Bottom-Right Bracket -->
    <path d="M 468 436 L 468 468 L 436 468" />
    <circle cx="468" cy="468" r="2.5" fill="#38bdf8" />
  </g>
</svg>
