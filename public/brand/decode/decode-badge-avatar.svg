<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1122" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <linearGradient id="isoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="isoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="isoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="cadGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00b4d8" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1.2" fill="#00f5d4" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base with Squircle Clip -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Technical Blueprint Grid -->
  <rect width="512" height="512" rx="104" fill="url(#cadGrid)" />

  <!-- Radar / Optical Target Circles -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />
  <circle cx="256" cy="240" r="120" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.25" />
  <circle cx="256" cy="240" r="60" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="2 4" />

  <!-- Technical Reticle / Crosshair Calipers -->
  <line x1="256" y1="56" x2="256" y2="92" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.6" />
  <line x1="256" y1="388" x2="256" y2="424" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.6" />
  <line x1="72" y1="240" x2="108" y2="240" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.6" />
  <line x1="404" y1="240" x2="440" y2="240" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.6" />

  <!-- Corner Caliper Brackets -->
  <path d="M 52 110 L 52 52 L 110 52" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.8" />
  <path d="M 460 110 L 460 52 L 402 52" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.8" />
  <path d="M 52 402 L 52 460 L 110 460" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.8" />
  <path d="M 460 402 L 460 460 L 402 460" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Sub-Squircle Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Central Deconstructed "M" System Core (Isometric Multi-Layer Architecture) -->
  <g transform="translate(0, -6)" filter="url(#laserGlow)">
    <!-- Base Layer: Hardware & Infrastructure (Deep Blueprint) -->
    <g transform="translate(0, 48)" opacity="0.45">
      <!-- Left Column Base -->
      <polygon points="172,210 220,182 220,224 172,252" fill="url(#isoLeft)" />
      <polygon points="220,182 268,210 268,252 220,224" fill="url(#isoRight)" />
      <polygon points="172,210 220,182 268,210 220,238" fill="url(#isoTop)" />
      
      <!-- Right Column Base -->
      <polygon points="244,210 292,182 292,224 244,252" fill="url(#isoLeft)" />
      <polygon points="292,182 340,210 340,252 292,224" fill="url(#isoRight)" />
      <polygon points="244,210 292,182 340,210 292,238" fill="url(#isoTop)" />
    </g>

    <!-- Intermediate Layer: Protocols & Switching Bus (Optical Cyan Glow) -->
    <g transform="translate(0, 24)" opacity="0.75">
      <path d="M 160 216 L 216 184 L 256 208 L 296 184 L 352 216 L 312 240 L 256 208 L 200 240 Z" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="216" cy="184" r="4" fill="#00f5d4" />
      <circle cx="256" cy="208" r="4" fill="#ffd166" />
      <circle cx="296" cy="184" r="4" fill="#00f5d4" />
    </g>

    <!-- Top Main Layer: Stylized "M" System Core (Deconstructed Isometric Architecture) -->
    <!-- Left Wing of M -->
    <polygon points="144,210 196,180 196,256 144,286" fill="url(#isoLeft)" />
    <polygon points="196,180 236,204 236,280 196,256" fill="url(#isoRight)" />
    <polygon points="144,210 196,180 236,204 184,234" fill="url(#isoTop)" />

    <!-- Right Wing of M -->
    <polygon points="276,204 316,180 316,256 276,280" fill="url(#isoLeft)" />
    <polygon points="316,180 368,210 368,286 316,256" fill="url(#isoRight)" />
    <polygon points="276,204 316,180 368,210 328,234" fill="url(#isoTop)" />

    <!-- Center V-Apex of M (Floating Core Diamond / Deconstructed Chip) -->
    <polygon points="224,196 256,176 288,196 256,216" fill="#00f5d4" opacity="0.95" />
    <polygon points="224,196 256,216 256,246 224,226" fill="#00b4d8" />
    <polygon points="256,216 288,196 288,226 256,246" fill="#0077b6" />

    <!-- Floating System Core Laser Orb (Amber Pulse - High Energy Kernel) -->
    <circle cx="256" cy="164" r="7" fill="url(#accentAmber)" filter="url(#glowCyan)" />
    <circle cx="256" cy="164" r="3" fill="#ffffff" />

    <!-- Optical Pulse Lines Connecting Apex -->
    <line x1="256" y1="164" x2="256" y2="176" stroke="#ffd166" stroke-width="1.8" stroke-dasharray="2 2" />
    <line x1="184" y1="180" x2="256" y2="164" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="328" y1="180" x2="256" y2="164" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- HUD Telemetry Text Overlay -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#00f5d4" opacity="0.85" letter-spacing="1.5">
    <text x="256" y="86" text-anchor="middle">SYS.DECONSTRUCT // [V1.0]</text>
    <text x="256" y="420" text-anchor="middle" fill="#38bdf8">LATENCY: 0.3s • PROTOCOL: ISO-8583</text>
  </g>

  <!-- Brand Typography Badge: MA GIẢI MÃ -->
  <g transform="translate(256, 360)">
    <!-- Label Background Pill -->
    <rect x="-110" y="-18" width="220" height="34" rx="8" fill="#0c1930" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glowCyan)" />
    
    <text x="0" y="5" font-family="'Be Vietnam Pro', 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      MA GIẢI MÃ
    </text>
  </g>

  <!-- Tiny Corner Coordinates -->
  <text x="56" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00b4d8" opacity="0.6">X:024.1</text>
  <text x="456" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00b4d8" opacity="0.6" text-anchor="end">Y:185.9</text>
  <text x="56" y="446" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00b4d8" opacity="0.6">@MaGiaiMa</text>
  <text x="456" y="446" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00b4d8" opacity="0.6" text-anchor="end">decode.macatung.dev</text>
</svg>
