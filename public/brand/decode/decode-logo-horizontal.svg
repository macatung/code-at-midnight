<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <linearGradient id="hIsoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="hIsoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="hIsoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="560" height="120" rx="16" fill="url(#hBgGrad)" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Subtle Blueprint Tech Lines in Background -->
  <line x1="16" y1="60" x2="104" y2="60" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="4 4" />
  <line x1="60" y1="16" x2="60" y2="104" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- ICON SECTION (Left 120px) -->
  <g transform="translate(60, 60)" filter="url(#hGlow)">
    <!-- Radar ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3" />
    
    <!-- Crosshairs -->
    <line x1="0" y1="-46" x2="0" y2="-36" stroke="#00f5d4" stroke-width="2" />
    <line x1="0" y1="36" x2="0" y2="46" stroke="#00f5d4" stroke-width="2" />
    <line x1="-46" y1="0" x2="-36" y2="0" stroke="#00f5d4" stroke-width="2" />
    <line x1="36" y1="0" x2="46" y2="0" stroke="#00f5d4" stroke-width="2" />

    <!-- Isometric M Core -->
    <g transform="translate(0, -2)">
      <!-- Left Column -->
      <polygon points="-24,-4 -12,-12 -12,12 -24,20" fill="url(#hIsoLeft)" />
      <polygon points="-12,-12 0,-4 0,20 -12,12" fill="url(#hIsoRight)" />
      <polygon points="-24,-4 -12,-12 0,-4 -12,4" fill="url(#hIsoTop)" />

      <!-- Right Column -->
      <polygon points="0,-4 12,-12 12,12 0,20" fill="url(#hIsoLeft)" />
      <polygon points="12,-12 24,-4 24,20 12,12" fill="url(#hIsoRight)" />
      <polygon points="0,-4 12,-12 24,-4 12,4" fill="url(#hIsoTop)" />

      <!-- Floating Apex Node -->
      <polygon points="-6,-10 0,-15 6,-10 0,-5" fill="#00f5d4" />
      <circle cx="0" cy="-20" r="3" fill="#ffb703" />
      <line x1="0" y1="-20" x2="0" y2="-15" stroke="#ffb703" stroke-width="1.2" />
    </g>
  </g>

  <!-- Divider Line with Pulse Dot -->
  <line x1="120" y1="24" x2="120" y2="96" stroke="#00b4d8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 4" />
  <circle cx="120" cy="60" r="3" fill="#00f5d4" opacity="0.8" />

  <!-- TYPOGRAPHY SECTION (Right) -->
  <g transform="translate(138, 0)">
    <!-- Top HUD Meta Row -->
    <g transform="translate(0, 32)">
      <!-- Channel Badge -->
      <rect x="0" y="-12" width="76" height="18" rx="4" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.4" />
      <text x="38" y="1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00f5d4" text-anchor="middle">@MaGiaiMa</text>

      <!-- System Telemetry Tag -->
      <text x="88" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38bdf8" opacity="0.8">SYSTEM.ANATOMY // 1080P</text>
    </g>

    <!-- Main Channel Title -->
    <text x="0" y="68" font-family="'Be Vietnam Pro', 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="url(#textCyan)" letter-spacing="1">
      MA GIẢI MÃ
    </text>

    <!-- Subdomain & Tagline Row -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f5d4">
        decode.macatung.dev
      </text>
      <text x="160" y="-1" font-family="'Be Vietnam Pro', 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        • Mở nắp những hệ thống vô hình vận hành thế giới
      </text>
    </g>
  </g>
</svg>
