name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

# Permissions required for GitHub Actions OIDC authentication with Google Cloud WIF
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-d1476ab6-42a7-4550-b42
  SERVICE_NAME: macatung-portfolio
  REGION: asia-southeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/1022020738551/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT: github-deployer@project-d1476ab6-42a7-4550-b42.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Container to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:nendoi-db-serverless \
            --set-env-vars "DB_CONNECTION=pgsql,DB_HOST=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:nendoi-db-serverless,DB_PORT=5432,DB_DATABASE=macatung,DB_USERNAME=macatung_user,DB_PASSWORD=MacaTungPg_2026_SecureKey" \
            --allow-unauthenticated \
            --quiet
