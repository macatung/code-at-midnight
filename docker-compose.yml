services:
  app:
    container_name: macatung_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8005:8080"
    volumes:
      - macatung_storage:/var/www/html/storage
      - macatung_database:/var/www/html/database
    environment:
      PORT: 8080
      APP_NAME: "Macatung Portfolio"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8005"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      AUTO_MIGRATE: "true"
    networks:
      - macatung_network

volumes:
  macatung_storage:
    name: macatung_storage
  macatung_database:
    name: macatung_database

networks:
  macatung_network:
    name: macatung_network
    driver: bridge
